[versions]
agp = "8.13.2"
kotlin = "2.3.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.2"
composeBom = "2025.12.01"
appcompat = "1.7.1"
material = "1.13.0"
koinKspCompiler = "2.3.1"
koinAnnotaions = "2.3.1"
koin-bom = "4.1.1"
ksp = "2.3.2"
room = "2.8.4"
timber = "5.0.1"
composeNavigation = "2.9.6"
koinCompose = "4.1.1"
constraintCompose = "1.1.1"
kotlinxSerializationJson = "1.9.0"
jetbrainsKotlinJvm = "2.3.0"
permissions = "0.37.3"
coil = "2.7.0"
media = "1.7.1"
media3 = "1.9.0"
materialIcons = "1.7.8"
runtimeAnnotation = "1.10.0"

[libraries]
#core
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
koinAndroid = { group = "io.insert-koin", name = "koin-android" }
koinAnnotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koinAnnotaions" }
koinKsp = { group = "io.insert-koin", name = "koin-ksp-compiler", version.ref = "koinKspCompiler" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
media = { group = "androidx.media", name = "media", version.ref = "media" }

# AndroidX Media3 artifacts
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

#presentation
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "composeNavigation" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-constraint-layout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintCompose" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koinCompose" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "permissions" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
#data_local
roomRuntime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
roomKtx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
roomKsp = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
#testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-runtime-annotation = { group = "androidx.compose.runtime", name = "runtime-annotation", version.ref = "runtimeAnnotation" }

[bundles]
core = ["androidx-core-ktx", "koinAndroid", "koinAnnotations", "timber", "media"]
app = ["media3-exoplayer", "media3-common", "media3-session", "media3-ui"]
presentation = [
    "androidx-lifecycle-runtime-ktx", "androidx-activity-compose", "androidx-ui",
    "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-material3",
    "androidx-appcompat", "material", "androidx-compose-navigation", "coil-compose",
    "koin-compose", "androidx-constraint-layout-compose", "kotlinx-serialization-json",
    "accompanist-permissions", "material-icons-extended", "media3-ui-compose", "media3-exoplayer",
    "media3-common", "media3-session"
]
domain = ["androidx-compose-runtime-annotation"]
presentationDebug = ["androidx-ui-tooling", "androidx-ui-test-manifest"]
dataLocal = ["roomRuntime", "roomKtx"]
testing = ["junit"]
androidTesting = ["androidx-junit", "androidx-espresso-core"]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jetbrainsKotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrainsKotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
